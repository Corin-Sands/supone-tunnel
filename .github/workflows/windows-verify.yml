# Author: Corin-Sands
# 仅 Windows 验证包：push 到 win-tun-verify 触发；上传 artifact，不发 Release。
name: windows-verify

on:
  push:
    branches:
      - win-tun-verify
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-verify-x64

      - name: Install npm deps
        shell: bash
        run: |
          npm ci
          npm ci --prefix ui

      - name: Tauri NSIS build
        shell: bash
        env:
          REGION: else
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --bundles nsis

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          cp src-tauri/target/release/bundle/nsis/*.exe dist-artifacts/
          ls -la dist-artifacts
          test -n "$(ls -A dist-artifacts)"

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        with:
          name: supone-tunnel-windows-verify
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 7
